/* ============ 詳細パネル（案件・顧客） ============ */

function openDrawer(type, id) {
  state.drawer = { type, id };
  renderDrawer();
  if (state.view === "cases" && state.mounted === "cases" && state.caseMode === "list") {
    $$("#caseBody .case-row").forEach(r => r.classList.toggle("selected", type === "case" && r.dataset.openCase === id));
  }
}
function closeDrawer() {
  state.drawer = null;
  renderDrawer();
  $$("#caseBody .case-row.selected").forEach(r => r.classList.remove("selected"));
}

function captureKeep(root) {
  const kept = {};
  $$("[data-keep]", root).forEach(inp => {
    kept[inp.dataset.keep] = { value: inp.value, focused: document.activeElement === inp, start: inp.selectionStart, end: inp.selectionEnd };
  });
  return kept;
}
function restoreKeep(root, kept) {
  for (const [key, v] of Object.entries(kept)) {
    const inp = root.querySelector(`[data-keep="${key}"]`);
    if (!inp) continue;
    inp.value = v.value;
    if (v.focused) {
      inp.focus();
      try { inp.setSelectionRange(v.start, v.end); } catch { /* noop */ }
    }
  }
}

function renderDrawer() {
  const root = $("#drawerRoot");
  if (!state.drawer) {
    if (root.classList.contains("open")) {
      root.classList.remove("open");
      document.body.classList.remove("drawer-open");
      if (!modalIsOpen()) document.body.classList.remove("no-scroll");
      setTimeout(() => { if (!state.drawer) root.innerHTML = ""; }, 260);
    }
    return;
  }
  let inner = "";
  if (state.drawer.type === "case") {
    const c = caseById(state.drawer.id);
    if (!c) { state.drawer = null; renderDrawer(); return; }
    inner = caseDrawerHTML(c);
  } else if (state.drawer.type === "client") {
    const cl = clientById(state.drawer.id);
    if (!cl) { state.drawer = null; renderDrawer(); return; }
    inner = clientDrawerHTML(cl);
  }
  const wasOpen = root.classList.contains("open") && root.innerHTML;
  const prevBody = root.querySelector(".drawer-body");
  const sameItem = wasOpen && root.dataset.item === `${state.drawer.type}:${state.drawer.id}`;
  const scrollTop = sameItem && prevBody ? prevBody.scrollTop : 0;
  const kept = sameItem ? captureKeep(root) : {};
  root.innerHTML = `<div class="drawer-backdrop" data-action="drawer-close"></div><aside class="drawer" role="dialog" aria-modal="false" aria-label="詳細">${inner}</aside>`;
  root.dataset.item = `${state.drawer.type}:${state.drawer.id}`;
  const body = root.querySelector(".drawer-body");
  if (body) body.scrollTop = scrollTop;
  restoreKeep(root, kept);
  document.body.classList.add("drawer-open");
  if (window.matchMedia && !window.matchMedia("(min-width: 1360px)").matches) document.body.classList.add("no-scroll");
  if (!wasOpen) {
    void root.offsetWidth;
    root.classList.add("open");
    const closeBtn = root.querySelector(".drawer-close");
    if (closeBtn && !isTouch()) setTimeout(() => closeBtn.focus({ preventScroll: true }), 60);
  }
}

      <div class="form-grid">
        <label class="field full"><span class="label">案件名 <span class="req">*</span></span>

          <div class="inline hidden" id="newClientBox">

        </div>
        <label class="field"><span class="label">業務カテゴリ</span><select class="select" name="category">${categoryOptionsHTML(c.category)}</select></label>
        <label class="field"><span class="label">ステータス</span><select class="select" name="status">${statusOptionsHTML(c.status)}</select></label>
        <label class="field"><span class="label">優先度</span><select class="select" name="priority">${PRIORITIES.map(p => `<option value="${p.key}"${c.priority === p.key ? " selected" : ""}>${p.long}</option>`).join("")}</select></label>
        <div class="field">
          <span class="label">期限（提出・完了）</span>
          <input class="input" type="date" name="dueDate" value="${esc(c.dueDate)}" aria-label="期限">
          <div class="quick" data-quick="dueDate">
            <button type="button" data-q="0">今日</button><button type="button" data-q="1">明日</button><button type="button" data-q="7">1週間後</button><button type="button" data-q="14">2週間後</button><button type="button" data-q="m1">1ヶ月後</button><button type="button" data-q="eom">月末</button><button type="button" data-q="calc">計算…</button><button type="button" data-q="clear">クリア</button>
          </div>
          <div class="hint" data-hint="dueDate"></div>
          <div class="calc-inline hidden" id="dueCalc">

              <select class="select" id="dcfUnit" style="max-width:110px" aria-label="単位"><option value="days">日</option><option value="bdays">開庁日</option><option value="weeks">週間</option><option value="months">ヶ月</option></select>

        <div class="field">
          <span class="label">申請日（受理日）</span>

        </div>
        <div class="field">
          <span class="label">標準処理期間</span>
          <div class="inline"><input class="input" type="number" min="0" max="999" name="periodN" value="${c.periodN ?? ""}" placeholder="例：40" style="max-width:110px" aria-label="日数"><select class="select" name="periodUnit" aria-label="単位">${units}</select></div>
          <div class="hint">申請日と合わせて、許可・結果の予定日を自動計算します</div>

        <div class="field">
          <span class="label">許可・結果の予定日</span>
          <input class="input" type="date" name="expectedDate" value="${esc(c.expectedDate)}" aria-label="許可・結果の予定日">

        <label class="field"><span class="label">繰り返し</span>
          <select class="select" name="repeat">${Object.entries(REPEAT_LABEL).map(([k, v]) => `<option value="${k}"${c.repeat === k ? " selected" : ""}>${v}</option>`).join("")}</select>
          <span class="hint">完了にすると次回分を自動作成（決算変更届など）</span></label>
      </div>

      <details class="fold" id="foldMoney"${hasMoney ? " open" : ""}>
        <summary>${icon("yen")}報酬・請求</summary>

          <label class="field"><span class="label">実費・立替金（証紙代など）</span><input class="input" name="expense" inputmode="numeric" value="${c.expense ?? ""}" placeholder="例：19000"></label>
          <div class="field"><span class="label">請求額（合計）</span><div class="sum-box" id="sumBox"></div></div>
          <label class="field"><span class="label">請求状況</span><select class="select" name="billing">${Object.entries(BILLING_LABEL).map(([k, v]) => `<option value="${k}"${c.billing === k ? " selected" : ""}>${v}</option>`).join("")}</select></label>
          <label class="field"><span class="label">請求日</span><input class="input" type="date" name="invoiceDate" value="${esc(c.invoiceDate)}"></label>

          ${MEMO_FIELDS.map(([k, label, ph]) => `
            <div class="field${k === "process" || k === "special" ? " full" : ""}">
              <span class="label">${label}</span>
              <textarea class="textarea" name="memo_${k}" placeholder="${esc(ph)}" aria-label="${label}">${esc(c.memoSections[k])}</textarea>
              ${k === "process" ? `<div class="quick"><button type="button" data-stamp="memo_process">日時を挿入</button></div>` : ""}
            </div>`).join("")}

      <div class="field full" style="margin-top:14px">
        <span class="label">チェックリスト <span class="hint">1行に1項目。文言を変えなければ完了チェックは保たれます</span></span>
        <textarea class="textarea" name="checklist" rows="8" placeholder="例：委任状を受領&#10;例：住民票の写し&#10;例：申請書の作成" aria-label="チェックリスト">${esc(c.checklist.map(x => x.text).join("\n"))}</textarea>
      </div>
      <div class="tpl-note hidden" id="tplNote"></div>
      ${datalistHTML("officeList", [...OFFICE_SUGGESTIONS, ...state.data.cases.map(x => x.office), ...S().templates.map(t => t.office)])}
    </form>`;
  const foot = `
    ${editing ? `<button type="button" class="btn danger" data-action="archive-case" data-id="${esc(c.id)}" data-from-form="1">${icon("archive")}保管</button><span class="grow"></span>` : ""}
    <span class="hint" style="margin-right:auto" id="formHint">${isTouch() ? "" : "Ctrl+Enter で保存"}</span>
    <button type="button" class="btn" data-action="modal-close">キャンセル</button>
    <button type="submit" form="caseForm" class="btn primary">${icon("check")}${editing ? "更新する" : "登録する"}</button>`;
  openModal({
    title: editing ? "案件の編集" : "新規案件",
    body, foot, size: "lg",
    onMount: m => bindCaseForm(m, editing, preset)
  });
}

function bindCaseForm(modal, editing, preset = {}) {
  const form = $("#caseForm", modal);
  const f = form.elements;
  let appliedTpl = null;
  let autoExpected = !f.expectedDate.value;

  const updateDueHint = () => {
    $('[data-hint="dueDate"]', form).innerHTML = dateHintHTML(f.dueDate.value);
  };
  const updateExpected = (force = false) => {
    const n = toIntOrNull(f.periodN.value);
    const hint = $('[data-hint="expected"]', form);
    if (f.appliedDate.value && n) {
      const calc = addPeriod(f.appliedDate.value, n, f.periodUnit.value);
      if (autoExpected || force) f.expectedDate.value = calc;
      hint.innerHTML = f.expectedDate.value === calc
        ? `<span class="ok">申請日＋${n}${PERIOD_UNIT_SHORT[f.periodUnit.value]}で計算（${esc(fmtDate(calc, { year: true }))}）</span>`
        : `計算上は ${esc(fmtDate(calc, { year: true }))} <button type="button" class="linkish" data-recalc="1">この日にする</button>`;
    } else if (n) {
      hint.textContent = "申請日を入れると自動で計算します";
    } else hint.textContent = f.expectedDate.value ? dateHintHTML(f.expectedDate.value).replace(/<[^>]+>/g, "") : "";
  };
  const updateSum = () => {
    const fee = parseAmount(f.fee.value), ex = parseAmount(f.expense.value);
    $("#sumBox", form).textContent = fee == null && ex == null ? "—" : fmtYen((fee || 0) + (ex || 0));
  };
  const setDate = (name, ymd) => {
    f[name].value = ymd || "";
    f[name].dispatchEvent(new Event("change", { bubbles: true }));
  };
  let inlineResult = "";
  const runInlineCalc = () => {
    const out = calcResultHTML($("#dcfBase", form).value, toIntOrNull($("#dcfN", form).value) || 0, $("#dcfUnit", form).value, $("#dcfDir", form).value === "before" ? -1 : 1);
    $("#dcfOut", form).innerHTML = out.html;
    inlineResult = out.result;
  };
  ["dcfBase", "dcfN", "dcfUnit", "dcfDir"].forEach(idName => {
    $("#" + idName, form).addEventListener("input", runInlineCalc);
    $("#" + idName, form).addEventListener("change", runInlineCalc);
  });
  $("#dcfApply", form).addEventListener("click", () => {
    if (!inlineResult) return;
    setDate("dueDate", inlineResult);
    $("#dueCalc", form).classList.add("hidden");
  });

  const cf = $("#clientFilter", form);
  if (cf) {
    cf.addEventListener("input", () => {
      const terms = queryTerms(cf.value);
      const cur = f.clientId.value;
      const list = sortedClients().filter(cl => !terms.length || matchTerms(clientSearchText(cl), terms));
      f.clientId.innerHTML = `<option value="">顧客未設定</option><option value="__new">＋ 新しい顧客を登録…</option>`
        + list.map(cl => `<option value="${esc(cl.id)}">${esc(clientDisplayName(cl))}</option>`).join("");
      if (list.some(cl => cl.id === cur)) f.clientId.value = cur;
      else if (terms.length && list.length === 1) f.clientId.value = list[0].id;
      else f.clientId.value = "";
      $("#newClientBox", form).classList.toggle("hidden", f.clientId.value !== "__new");
    });
  }
  f.clientId.addEventListener("change", () => {
    const isNew = f.clientId.value === "__new";
    $("#newClientBox", form).classList.toggle("hidden", !isNew);
    $("#newClientHint", form).classList.toggle("hidden", !isNew || !$("#newClientHint", form).innerHTML);
    if (isNew) f.newClientName.focus();
  });
  f.newClientName.addEventListener("input", () => {
    const hint = $("#newClientHint", form);
    const sims = f.newClientName.value.trim() ? findSimilarClients({ name: f.newClientName.value }, { contain: true }).slice(0, 3) : [];
    hint.innerHTML = sims.length
      ? `<span class="warn">似ている顧客が登録済みです：</span>${sims.map(cl => `<button type="button" class="linkish" data-pick-client="${esc(cl.id)}">${esc(cl.name)}</button>`).join("、")}（押すとその顧客を選びます）`
      : "";
    hint.classList.toggle("hidden", !sims.length);
  });
  f.dueDate.addEventListener("change", updateDueHint);
  f.dueDate.addEventListener("input", updateDueHint);
  ["appliedDate", "periodN", "periodUnit"].forEach(n => {
    f[n].addEventListener("change", () => updateExpected());
    f[n].addEventListener("input", () => updateExpected());
  });
  f.expectedDate.addEventListener("change", () => { autoExpected = !f.expectedDate.value; updateExpected(); });
  f.fee.addEventListener("input", updateSum);
  f.expense.addEventListener("input", updateSum);
  f.billing.addEventListener("change", () => {
    if ((f.billing.value === "invoiced" || f.billing.value === "paid") && !f.invoiceDate.value) f.invoiceDate.value = state.today;
    if (f.billing.value === "paid" && !f.paidDate.value) f.paidDate.value = state.today;
  });
  f.status.addEventListener("change", () => {
    if (f.status.value === "申請済み" && !f.appliedDate.value) {
      f.appliedDate.value = state.today;
      updateExpected();
    }
  });

  form.addEventListener("click", e => {
    const q = e.target.closest("[data-q]");
    if (q) {
      const name = q.parentElement.dataset.quick;
      const v = q.dataset.q;
      if (v === "clear") setDate(name, "");
      else if (v === "m1") setDate(name, addMonths(state.today, 1));
      else if (v === "eom") setDate(name, endOfMonth(state.today));
      else if (v === "calc") { const box = $("#dueCalc", form); box.classList.toggle("hidden"); if (!box.classList.contains("hidden")) { $("#dcfBase", form).value = f.dueDate.value || state.today; runInlineCalc(); } }
      else setDate(name, addDays(state.today, Number(v)));
      if (name === "appliedDate") updateExpected();
      return;
    }
    const pick = e.target.closest("[data-pick-client]");
    if (pick) {
      const id = pick.dataset.pickClient;
      if (![...f.clientId.options].some(o => o.value === id)) f.clientId.innerHTML = clientOptionsHTML(id);
      f.clientId.value = id;
      f.newClientName.value = "";
      $("#newClientBox", form).classList.add("hidden");
      $("#newClientHint", form).classList.add("hidden");
      return;
    }
    const sd = e.target.closest("[data-set-date]");
    if (sd) { setDate("dueDate", sd.dataset.setDate); return; }
    if (e.target.closest("[data-recalc]")) { autoExpected = true; updateExpected(true); return; }
    const st = e.target.closest("[data-stamp]");
    if (st) { insertStamp(f[st.dataset.stamp]); return; }
    const chip = e.target.closest("[data-tpl]");
    if (chip) {
      const t = templateById(chip.dataset.tpl);
      if (!t) return;
      appliedTpl = applyTemplateToForm(form, t, appliedTpl);
      $$("[data-tpl]", form).forEach(b => b.classList.toggle("active", b === chip));
      form.dataset.templateId = t.id;
      updateExpected();
      updateSum();
    }
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    saveCaseForm(form, editing);
  });
  if (preset.templateId) {
    const t = templateById(preset.templateId);
    if (t) {
      appliedTpl = applyTemplateToForm(form, t, null, { keepTitle: Boolean(preset.title) });
      form.dataset.templateId = t.id;
      const chip = $(`[data-tpl="${CSS.escape(t.id)}"]`, form);
      if (chip) chip.classList.add("active");
    }
  }
  if (preset.licenseId) form.dataset.licenseId = preset.licenseId;
  updateDueHint();
  updateExpected();
  updateSum();
}

function applyTemplateToForm(form, t, prev, { keepTitle = false } = {}) {
  const f = form.elements;
  const curTitle = f.title.value.trim();
  if (!keepTitle && (!curTitle || (prev && curTitle === (prev.title || prev.name)))) f.title.value = t.title || t.name;
  if (![...f.category.options].some(o => o.value === t.category)) f.category.insertAdjacentHTML("beforeend", `<option value="${esc(t.category)}">${esc(t.category)}</option>`);
  f.category.value = t.category;
  if (t.office) f.office.value = t.office;
  f.periodN.value = t.periodN ?? "";
  f.periodUnit.value = t.periodUnit || "days";
  if (t.fee != null) f.fee.value = t.fee;
  if (t.expense != null) f.expense.value = t.expense;
  f.repeat.value = t.repeat || "";
  const cur = f.checklist.value.trim();
  const prevList = prev ? prev.checklist.join("\n") : null;
  if (!cur || cur === prevList) f.checklist.value = t.checklist.join("\n");
  else f.checklist.value = uniq([...cur.split(/\r?\n/).map(s => s.trim()).filter(Boolean), ...t.checklist]).join("\n");
  if (t.fee != null || t.expense != null) { const fold = $("#foldMoney", form); if (fold) fold.open = true; }
  const note = $("#tplNote", form);
  if (note) {
    const bits = [];
    if (t.note) bits.push(t.note);
    if (t.renewYears) bits.push(`取得後は「許認可台帳」に登録すると${t.renewYears}年後の更新時期をお知らせします。`);
    note.textContent = bits.join(" ");
    note.classList.toggle("hidden", !bits.length);
  }
  return t;
}

function insertStamp(textarea) {
  const stamp = `[${stampNow()}] `;
  const start = textarea.selectionStart ?? textarea.value.length;
  const end = textarea.selectionEnd ?? textarea.value.length;
  const before = textarea.value.slice(0, start);
  const after = textarea.value.slice(end);
  const prefix = before && !before.endsWith("\n") ? "\n" : "";
  textarea.value = before + prefix + stamp + after;
  const pos = before.length + prefix.length + stamp.length;
  textarea.focus();
  textarea.setSelectionRange(pos, pos);
}

function saveCaseForm(form, editing) {
  const f = form.elements;
  const title = f.title.value.trim();
  if (!title) {
    f.title.classList.add("invalid");
    f.title.focus();
    toast("案件名を入力してください", { type: "error" });
    return;
  }
  let clientId = f.clientId.value;
  let newClient = null;
  let reusedClient = null;
  if (clientId === "__new") {
    const name = f.newClientName.value.trim();
    if (!name) {
      f.newClientName.classList.add("invalid");
      f.newClientName.focus();
      toast("新しい顧客名を入力してください", { type: "error" });
      return;
    }
    const key = clientNameKey(name);
    const same = state.data.clients.filter(c => clientNameKey(c.name) === key).sort((a, b) => Number(a.archived) - Number(b.archived));
    if (same.length) {
      clientId = same[0].id;
      reusedClient = same[0];
    } else { newClient = normalizeClient({ name, type: f.newClientType.value }); clientId = newClient.id; }
  }
  const memoSections = {};
  MEMO_FIELDS.forEach(([k]) => { memoSections[k] = f[`memo_${k}`].value.trim(); });
  const fields = {
    title,
    clientId,
    clientName: newClient ? newClient.name : (clientById(clientId)?.name || ""),
    category: f.category.value,
    priority: f.priority.value,
    dueDate: validYMD(f.dueDate.value),
    office: f.office.value.trim(),
    appliedDate: validYMD(f.appliedDate.value),
    expectedDate: validYMD(f.expectedDate.value),
    periodN: toIntOrNull(f.periodN.value),
    periodUnit: f.periodUnit.value,
    repeat: f.repeat.value,
    fee: parseAmount(f.fee.value),
    expense: parseAmount(f.expense.value),
    billing: f.billing.value,
    invoiceDate: validYMD(f.invoiceDate.value),
    paidDate: validYMD(f.paidDate.value),
    memoSections,
    memo: composeMemo(memoSections)
  };
  if (fields.billing === "paid" && !fields.paidDate) fields.paidDate = state.today;
  const status = f.status.value;
  let createdId = null;
  let msgs = [];
  const ok = commit(data => {
    if (newClient) data.clients.unshift(newClient);
    if (reusedClient && reusedClient.archived) {
      const rc = data.clients.find(x => x.id === reusedClient.id);
      if (rc) { rc.archived = false; rc.updatedAt = nowISO(); }
    }
    if (editing) {
      const c = data.cases.find(x => x.id === editing.id);
      if (!c) return false;
      Object.assign(c, fields);
      c.checklist = mergeChecklist(c.checklist, f.checklist.value);
      msgs = applyStatusChange(data, c, status);
      c.updatedAt = nowISO();
    } else {
      const c = normalizeCase({ ...fields, status: S().defaultStatus }, S());
      c.id = uid();
      c.createdAt = c.updatedAt = nowISO();
      c.checklist = mergeChecklist([], f.checklist.value);
      c.templateId = form.dataset.templateId || "";
      c.licenseId = form.dataset.licenseId || "";
      data.cases.unshift(c);
      msgs = applyStatusChange(data, c, status);
      createdId = c.id;
    }
    return true;
  });
  if (ok === false) return;
  closeModal();
  if (reusedClient) msgs.unshift(`登録済みの顧客「${reusedClient.name}」に紐づけ`);
  const extra = msgs.length ? `（${msgs.join("・")}）` : "";
  if (createdId) toast(`案件を登録しました${extra}`, { action: "開く", onAction: () => openDrawer("case", createdId) });
  else toast(`案件を更新しました${extra}`);
}

/* 状態遷移（完了・申請済み・請求済み などの自動処理を一か所に集約） */
function applyStatusChange(data, c, newStatus) {
  const msgs = [];
  if (!newStatus) return msgs;
  if (newStatus === DONE_STATUS) {
    if (!c.completed) {
      if (c.status !== DONE_STATUS) c.statusBeforeDone = c.status;
      c.completed = true;
      c.completedAt = nowISO();
    }
    c.status = DONE_STATUS;
    if (c.repeat && !c.repeatSpawned) {
      const next = spawnNextCase(c);
      data.cases.unshift(next);
      c.repeatSpawned = true;
      msgs.push(`次回分（期限 ${next.dueDate ? fmtDate(next.dueDate, { year: true, wd: false }) : "未設定"}）を作成`);
    }
  } else {
    const was = c.status;
    c.status = newStatus;
    c.completed = false;
    c.completedAt = "";
    if (newStatus === "申請済み" && was !== "申請済み" && !c.appliedDate) {
      c.appliedDate = state.today;
      msgs.push(`申請日を${fmtDate(state.today, { wd: false })}で記録`);
    }
    if (c.appliedDate && c.periodN && !c.expectedDate) {
      c.expectedDate = addPeriod(c.appliedDate, c.periodN, c.periodUnit);
      msgs.push(`許可予定日を${fmtDate(c.expectedDate, { wd: false })}に設定`);
    }
    if (newStatus === "請求済み" && (c.billing === "none" || c.billing === "estimate") && hasAmount(c)) {
      c.billing = "invoiced";
      if (!c.invoiceDate) c.invoiceDate = state.today;
      msgs.push("請求状況を「請求済」に");
    }
  }
  c.updatedAt = nowISO();
  return msgs;
}
function spawnNextCase(c) {
  const step = c.repeatEvery || 1;
  const nextDue = c.dueDate ? (c.repeat === "monthly" ? addMonths(c.dueDate, step) : addYears(c.dueDate, step)) : "";
  const nextStatus = S().defaultStatus;
  return normalizeCase({
    id: uid(),
    title: c.title,
    clientId: c.clientId,
    clientName: c.clientName,
    category: c.category,
    priority: c.priority,
    status: nextStatus,
    dueDate: nextDue,
    office: c.office,
    periodN: c.periodN,
    periodUnit: c.periodUnit,
    fee: c.fee,
    expense: c.expense,
    billing: "none",
    repeat: c.repeat,
    repeatEvery: c.repeatEvery,
    templateId: c.templateId,
    licenseId: c.licenseId,
    demo: c.demo,
    memoSections: { referral: c.memoSections.referral, caution: c.memoSections.caution, process: "", special: c.memoSections.special },
    checklist: c.checklist.map(x => ({ text: x.text, done: false })),
    createdAt: nowISO(),
    updatedAt: nowISO()
  }, S());
}

/* ---------- 連絡文（書類のご依頼・進捗・完了） ---------- */
const DOC_PATTERN = /(証明書|住民票|謄本|抄本|写し|契約書|診断書|証書|写真|定款|決算書|見積書|印鑑|資料|通帳|車検証|修了証|資格者証|承諾書|同意書|委任状|書類|許可証の写し|申請書控)/;
const NOT_DOC_PATTERN = /(作成|調査|ヒアリング|立会い|実測|提出・|申請・|納付|案内)/;
function looksLikeDocument(text) { return DOC_PATTERN.test(text) && !NOT_DOC_PATTERN.test(text); }
function addresseeOf(c) {
  const client = clientById(c.clientId);
  if (!client) return c.clientName ? `${c.clientName} 様` : "〇〇 様";
  if (client.type === "法人") return client.person ? `${client.name}\n${client.person} 様` : `${client.name} 御中`;
  return `${client.name} 様`;
}
function signatureOf(o) {
  return ["――――――――――――", o.name, [o.title, o.person].filter(Boolean).join(" "),
    o.postal || o.address ? `${o.postal ? `〒${o.postal} ` : ""}${o.address || ""}` : "",
    o.phone ? `TEL ${o.phone}` : "", o.email ? `Mail ${o.email}` : "", o.line ? `LINE ${o.line}` : ""
  ].filter(Boolean).join("\n");
}
const STATUS_PHRASE = {
  "相談中": "ご相談内容をもとに、手続きの進め方を確認しております。",
  "書類待ち": "必要書類のご準備をお待ちしております。",
  "作成中": "申請書類を作成しております。",
  "申請済み": "申請を行い、現在審査中です。",
  "補正対応中": "審査機関からの補正（書類の修正・追加）に対応しております。",
  "請求済み": "手続きが完了し、ご請求書をお送りしております。"
};
function buildMessage(kind, c, { items = [], due = "" } = {}) {
  const o = S().office;
  const to = addresseeOf(c);
  const opener = `いつもお世話になっております。\n${o.name}の${o.sender || o.person || ""}です。`;
  const sig = signatureOf(o);
  if (kind === "request") {
    return `${to}\n\n${opener}\n\n「${c.title}」の手続きに向けて、下記の書類のご準備をお願いいたします。\n\n${items.length ? items.map(t => `・${t}`).join("\n") : "・（書類名）"}\n\n${due ? `恐れ入りますが、${fmtDateJP(due)}までにご用意いただけますと幸いです。\n` : ""}取得方法などご不明な点がございましたら、お気軽にお問い合わせください。\nどうぞよろしくお願いいたします。\n\n${sig}`;
  }
  if (kind === "progress") {
    const lines = [`現在の状況：${STATUS_PHRASE[c.status] || `${c.status}です。`}`];
    if (c.appliedDate) lines.push(`申請日：${fmtDateJP(c.appliedDate)}`);
    if (c.expectedDate && isOpen(c)) lines.push(`結果の見込み：${fmtDateJP(c.expectedDate)}頃（標準処理期間による目安です）`);
    const pending = c.checklist.filter(x => !x.done && looksLikeDocument(x.text));
    if (pending.length && ["相談中", "書類待ち"].includes(c.status)) lines.push(`\n引き続き、次の書類のご準備をお願いいたします。\n${pending.map(x => `・${x.text}`).join("\n")}`);
    return `${to}\n\n${opener}\n\n「${c.title}」の進捗をご報告いたします。\n\n${lines.join("\n")}\n\n引き続きどうぞよろしくお願いいたします。\n\n${sig}`;
  }
  return `${to}\n\n${opener}\n\n「${c.title}」の手続きが完了いたしましたので、ご報告いたします。\n許可証等のお受け渡し方法については、別途ご連絡いたします。\n\nこのたびはご依頼いただき、誠にありがとうございました。\n今後とも、許認可のことなど何かございましたらお気軽にご相談ください。\n\n${sig}`;
}
const MSG_SUBJECT = { request: "【ご依頼】必要書類のご準備について", progress: "【ご報告】手続きの進捗について", done: "【ご報告】手続き完了のお知らせ" };
const MSG_LABEL = { request: "書類のご依頼", progress: "進捗のご報告", done: "完了のご報告" };

function openComposer(caseId, kind = null) {
  const c = caseById(caseId);
  if (!c) return;
  const client = clientById(c.clientId);
  const pending = c.checklist.filter(x => !x.done);
  if (!kind) kind = c.completed || c.status === "請求済み" ? "done" : (["申請済み", "補正対応中"].includes(c.status) ? "progress" : "request");
  const dueSuggest = addBusinessDays(state.today, 5);
  const body = `
    <div class="seg" id="msgKinds" role="group" aria-label="文面の種類">
      ${Object.entries(MSG_LABEL).map(([k, v]) => `<button type="button" data-kind="${k}">${v}</button>`).join("")}

    <div class="form-grid" style="margin-top:12px">
      <div class="field full" id="msgItemsBox">
        <span class="label">依頼する書類（未完了のチェック項目から選択）</span>
        ${pending.length ? `<div class="msg-items">${pending.map(x => `<label class="check-item"><input type="checkbox" data-msg-item value="${esc(x.text)}"${looksLikeDocument(x.text) ? " checked" : ""}><span class="check-text">${esc(x.text)}</span></label>`).join("")}</div>` : `<p class="hint">未完了のチェック項目がありません。本文を直接編集してください。</p>`}
      </div>
      <label class="field" id="msgDueBox"><span class="label">ご用意いただきたい期日</span><input class="input" type="date" id="msgDue" value="${dueSuggest}"></label>
      <label class="field" style="justify-content:flex-end"><span class="label">送信操作をしたら</span><span class="inline" style="min-height:38px"><input type="checkbox" id="msgLog" checked><span class="small" style="font-weight:700">経過記録に残す</span></span></label>
      <label class="field full"><span class="label">本文（自由に編集できます）</span><textarea class="textarea" id="msgText" rows="15"></textarea></label>
    </div>`;
  const foot = `
    <button type="button" class="btn" data-action="modal-close">閉じる</button>
    <span class="grow"></span>
    <button type="button" class="btn" data-msg-send="copy">${icon("copy")}コピー</button>
    <button type="button" class="btn" data-msg-send="mail">${icon("mail")}メールで開く</button>
    <button type="button" class="btn success" data-msg-send="line">${icon("chat")}LINEで送る</button>`;
  openModal({
    title: `連絡文の作成：${c.title}`,
    body, foot, size: "lg",
    onMount: m => {
      let cur = kind;
      let edited = false;
      const ta = $("#msgText", m);
      const gen = () => {
        const items = $$("[data-msg-item]", m).filter(x => x.checked).map(x => x.value);
        ta.value = buildMessage(cur, c, { items, due: $("#msgDue", m).value });
        edited = false;
      };
      const setKind = k => {
        cur = k;
        $$("#msgKinds [data-kind]", m).forEach(b => b.classList.toggle("active", b.dataset.kind === k));
        $("#msgItemsBox", m).classList.toggle("hidden", k !== "request");
        $("#msgDueBox", m).classList.toggle("hidden", k !== "request");
        gen();
      };
      ta.addEventListener("input", () => { edited = true; });
      m.addEventListener("change", async e => {
        if (e.target.matches("[data-msg-item], #msgDue")) {
          if (edited && !(await askConfirm({ title: "本文を作り直しますか？", message: "編集した本文は、選択内容に合わせて作り直されます。", ok: "作り直す" }))) return;
          gen();
        }
      });
      m.addEventListener("click", async e => {
        const kb = e.target.closest("[data-kind]");
        if (kb) {
          if (edited && !(await askConfirm({ title: "文面を切り替えますか？", message: "編集した本文は失われます。", ok: "切り替える" }))) return;
          setKind(kb.dataset.kind);
          return;
        }
        const sb = e.target.closest("[data-msg-send]");
        if (!sb) return;
        const text = ta.value;
        const how = sb.dataset.msgSend;
        if (how === "copy") {
          const ok = await copyText(text);
          toast(ok ? "本文をコピーしました" : "コピーできませんでした。本文を選択してコピーしてください", { type: ok ? "" : "error" });
          if (!ok) return;
        } else if (how === "mail") {
          const subject = `${MSG_SUBJECT[cur]}（${c.title}）`;
          window.location.href = `mailto:${encodeURIComponent(client?.email || "")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
        } else if (how === "line") {
          window.open(`https://line.me/R/share?text=${encodeURIComponent(text)}`, "_blank", "noopener");
        }

          const via = { copy: "コピー", mail: "メール", line: "LINE" }[how];
          addLogEntry(c.id, `${MSG_LABEL[cur]}の連絡文を作成（${via}）`, { quiet: true });
          $("#msgLog", m).checked = false;
        }
      });
      setKind(kind);
    }
  });
}

/* ---------- 期限計算 ---------- */
const CALC_UNIT_LABEL = { days: "日", bdays: "開庁日", weeks: "週間", months: "ヶ月", years: "年" };
function calcResultHTML(base, n, unit, dir) {
  if (!parseYMD(base)) return { html: `<p class="hint">基準日を入れてください。</p>`, result: "" };
  const r = addPeriod(base, dir * n, unit);
  const reason = closedReason(r);
  const days = diffDays(state.today, r);
  let html = `<div class="calc-result"><b>${esc(fmtDateLong(r))}</b><span class="hint">（${esc(fmtDate(base, { year: true }))}の${n}${CALC_UNIT_LABEL[unit]}${dir < 0 ? "前" : "後"}・今日から${days >= 0 ? `${days}日後` : `${-days}日前`}）</span></div>`;
  if (reason) {
    html += `<p class="hint warn">この日は閉庁日（${esc(reason)}）です。直前の開庁日：${esc(fmtDate(prevOpenDay(r), { year: true }))}／直後の開庁日：${esc(fmtDate(nextOpenDay(r), { year: true }))}</p>`;
  }
  return { html, result: r };
}
function openDateCalc({ base = state.today } = {}) {
  openModal({
    title: "期限計算",
    size: "sm",
    body: `
      <div class="form-grid">
        <label class="field full"><span class="label">基準日</span><input class="input" type="date" id="dcBase" value="${esc(base)}"></label>
        <label class="field"><span class="label">数</span><input class="input" type="number" id="dcN" value="10" min="0"></label>
        <label class="field"><span class="label">単位</span><select class="select" id="dcUnit"><option value="days">日（暦日）</option><option value="bdays">開庁日</option><option value="weeks">週間</option><option value="months">ヶ月</option><option value="years">年</option></select></label>
        <label class="field full"><span class="label">方向</span><select class="select" id="dcDir"><option value="after">後（基準日から先）</option><option value="before">前（基準日から遡る）</option></select></label>
        <div class="quick full">
          <button type="button" data-preset="10,days,before">10日前</button>
          <button type="button" data-preset="30,days,before">30日前</button>
          <button type="button" data-preset="40,days,after">40日後</button>
          <button type="button" data-preset="55,days,after">55日後</button>
          <button type="button" data-preset="2,months,after">2ヶ月後</button>
          <button type="button" data-preset="4,months,after">4ヶ月後</button>
          <button type="button" data-preset="5,bdays,after">5開庁日後</button>
        </div>
      </div>
      <div id="dcOut" style="margin-top:14px"></div>
      <p class="hint" style="margin-top:10px">「開庁日」は土日・祝日・年末年始（12/29〜1/3）を除いて数えます。法令上の期間の数え方（初日不算入など）は手続きごとにご確認ください。</p>`,
    foot: `<button type="button" class="btn" data-action="modal-close">閉じる</button>
      <button type="button" class="btn primary" id="dcCopy">${icon("copy")}日付をコピー</button>`,
    onMount: m => {
      let result = "";
      const again = () => {
        const out = calcResultHTML($("#dcBase", m).value, toIntOrNull($("#dcN", m).value) || 0, $("#dcUnit", m).value, $("#dcDir", m).value === "before" ? -1 : 1);
        $("#dcOut", m).innerHTML = out.html;
        result = out.result;
      };
      m.addEventListener("input", again);
      m.addEventListener("change", again);
      m.addEventListener("click", async e => {
        const p = e.target.closest("[data-preset]");
        if (p) {
          const [n, unit, dir] = p.dataset.preset.split(",");
          $("#dcN", m).value = n;
          $("#dcUnit", m).value = unit;
          $("#dcDir", m).value = dir;
          again();
        }
        if (e.target.closest("#dcCopy") && result) {
          if (await copyText(fmtDateLong(result))) toast("日付をコピーしました");
        }
      });
      again();
    }
  });
}

/* ---------- 読み込み ---------- */
async function handleJSONFile(file) {
  let parsed;
  try { parsed = JSON.parse(await readFileText(file)); }
  catch { toast("JSONファイルを読み込めませんでした", { type: "error" }); return; }
  let incoming;
  try { incoming = normalizeData(parsed); }
  catch { toast("データの形式を認識できませんでした", { type: "error" }); return; }
  const when = parsed && parsed.exportedAt ? fmtDateTime(parsed.exportedAt) : "不明";
  const withSettings = Boolean(parsed && parsed.settings);
  const cur = state.data;
  const empty = !hasAnyData();
  openModal({
    title: "バックアップの読み込み",
    size: "sm",
    body: `
      <dl class="kv">
        <dt>ファイル</dt><dd>${esc(file.name)}</dd>
        <dt>保存日時</dt><dd>${esc(when)}</dd>
        <dt>内容</dt><dd>案件 ${incoming.cases.length}・顧客 ${incoming.clients.length}・許認可 ${incoming.licenses.length}</dd>
        <dt>現在のデータ</dt><dd>案件 ${cur.cases.length}・顧客 ${cur.clients.length}・許認可 ${cur.licenses.length}</dd>
      </dl>
      <p class="hint" style="margin-top:12px">「統合」は、同じ案件・顧客は更新日時が新しい方を残し、ないものを追加します（別の端末のデータを合わせるとき向け）。「置き換え」は、現在のデータをファイルの内容に入れ替えます。どちらも実行前に復元ポイントを保存します。</p>`,
    foot: `
      <button type="button" class="btn" data-action="modal-close">キャンセル</button>
      <button type="button" class="btn ${empty ? "" : "primary"}" id="impMerge"${empty ? " disabled" : ""}>統合する</button>
      <button type="button" class="btn ${empty ? "primary" : "danger"}" id="impReplace">置き換える</button>`,
    onMount: m => {
      $("#impMerge", m).addEventListener("click", async () => {
        await createSnapshot("読み込み（統合）の前");
        const { data, stats } = mergeInto(state.data, incoming, { withSettings });
        closeModal();
        state.data = data;
        state.data.meta.updatedAt = nowISO();
        persist();
        state.mounted = null;
        renderAll();
        toast(`統合しました（追加 ${stats.added}件・更新 ${stats.updated}件）`);
      });
      $("#impReplace", m).addEventListener("click", async () => {
        if (!empty) {
          const go = await askConfirm({ title: "データを置き換えますか？", message: "現在のデータはファイルの内容に置き換わります（直前の状態は復元ポイントに保存されます）。", ok: "置き換える", danger: true });
          if (!go) return;
          await createSnapshot("読み込み（置き換え）の前");
        }
        closeModal();
        if (!withSettings) incoming.settings = JSON.parse(JSON.stringify(state.data.settings));
        state.data = incoming;
        state.data.meta.updatedAt = nowISO();
        persist();
        state.mounted = null;
        state.drawer = null;
        renderAll();
        toast("バックアップを読み込みました");
      });
    }
  });
}

const CSV_HEADER_MAP = [
  [/^(顧客名|氏名|名称|会社名|商号|お名前|name)$/i, "name"],
  [/^(フリガナ|ふりがな|カナ|よみ|読み|kana)$/i, "kana"],
  [/^(区分|種別|type)$/i, "type"],
  [/^(担当者|代表者|担当|person)$/i, "person"],
  [/^(電話|電話番号|tel|携帯|phone)$/i, "phone"],
  [/^(メール|メールアドレス|e-?mail|mail)$/i, "email"],
  [/^(郵便番号|〒)$/i, "postal"],
  [/^(住所|所在地|address)$/i, "address"],
  [/^(紹介元|紹介者)$/i, "referral"],
  [/^(注意事項)$/i, "caution"],
  [/^(業務過程|経過)$/i, "process"],
  [/^(特記事項|備考|メモ|memo)$/i, "special"]
];
async function handleClientCSV(file) {
  const rows = parseCSV(await readFileText(file));
  if (!rows.length) { toast("CSVにデータがありません", { type: "error" }); return; }
  const header = rows[0].map(h => String(h).trim());
  const map = header.map(h => (CSV_HEADER_MAP.find(([re]) => re.test(h)) || [null, null])[1]);
  const hasHeader = map.some(Boolean);
  const dataRows = hasHeader ? rows.slice(1) : rows;
  const keyIdx = key => map.indexOf(key);
  const nameIdx = hasHeader ? keyIdx("name") : 0;
  if (nameIdx < 0) { toast("「顧客名」の列が見つかりませんでした", { type: "error" }); return; }
  const recs = dataRows.map(r => {
    const get = key => { const i = hasHeader ? keyIdx(key) : -1; return i >= 0 ? String(r[i] ?? "").trim() : ""; };
    const postal = get("postal");
    return {
      name: String(r[nameIdx] ?? "").trim(), kana: get("kana"), type: get("type"), person: get("person"), phone: get("phone"), email: get("email"),
      address: [postal ? `〒${postal.replace(/^〒/, "")}` : "", get("address")].filter(Boolean).join(" "),
      memoSections: { referral: get("referral"), caution: get("caution"), process: get("process"), special: get("special") }
    };
  }).filter(r => r.name);
  const existing = new Map(state.data.clients.map(c => [c.name, c]));
  const adds = recs.filter(r => !existing.has(r.name));
  const upd = recs.filter(r => existing.has(r.name));
  openModal({
    title: "顧客CSVの取り込み",
    size: "sm",
    body: `<p>${esc(file.name)}</p>
      <dl class="kv" style="margin-top:8px"><dt>新規登録</dt><dd>${adds.length}件</dd><dt>既存と同名</dt><dd>${upd.length}件（空欄の項目だけ補います）</dd></dl>
      ${adds.length ? `<p class="hint" style="margin-top:10px">例：${esc(adds.slice(0, 5).map(r => r.name).join("、"))}${adds.length > 5 ? " ほか" : ""}</p>` : ""}
      <p class="hint" style="margin-top:10px">対応する列名：顧客名・フリガナ・区分・担当者・電話・メール・郵便番号・住所・紹介元・注意事項・特記事項（備考）</p>`,
    foot: `<button type="button" class="btn" data-action="modal-close">キャンセル</button><button type="button" class="btn primary" id="csvGo"${recs.length ? "" : " disabled"}>取り込む</button>`,
    onMount: m => {
      $("#csvGo", m).addEventListener("click", async () => {
        await createSnapshot("顧客CSV取り込みの前");
        closeModal();
        commit(data => {
          for (const r of adds) data.clients.push(normalizeClient({ ...r, type: CLIENT_TYPES.includes(r.type) ? r.type : "法人" }));
          for (const r of upd) {
            const c = data.clients.find(x => x.name === r.name);
            if (!c) continue;
            ["kana", "person", "phone", "email", "address"].forEach(k => { if (!c[k] && r[k]) c[k] = r[k]; });
            MEMO_FIELDS.forEach(([k]) => { if (!c.memoSections[k] && r.memoSections[k]) c.memoSections[k] = r.memoSections[k]; });
            c.memo = composeMemo(c.memoSections);
            c.updatedAt = nowISO();
          }
          return true;
        }, { message: `顧客を取り込みました（新規 ${adds.length}件・補完 ${upd.length}件）` });
      });
    }
  });
}

    ...NAV.map((n, i) => ({ label: `${n.label}を開く`, keys: `${n.label} 画面 ${n.key}`, ic: n.icon, run: () => setView(n.key), hint: String(i + 1) })),
    { label: "ショートカット一覧", keys: "へるぷ ヘルプ ショートカット", ic: "keyboard", run: () => openHelp(), hint: "?" }
  ];

function openPalette() {
  openModal({
    title: "",
    cls: "palette",
    top: true,
    body: `<input class="input pal-input" id="palInput" placeholder="案件・顧客・許認可を検索、またはコマンド（例：新規、バックアップ）" autocomplete="off" aria-label="検索" autofocus>
      <div class="pal-results" id="palResults" role="listbox"></div>
      <div class="pal-foot">↑↓ で選択　Enter で開く　Esc で閉じる</div>`,
    onMount: m => {
      const input = $("#palInput", m);
      const box = $("#palResults", m);
      let items = [];
      let active = 0;
      const render = () => {
        const terms = queryTerms(input.value);
        const groups = [];
        const cmds = paletteCommands().filter(cmd => !terms.length || matchTerms(normText(`${cmd.label} ${cmd.keys}`), terms));
        let cases, clients, lics;
        if (terms.length) {
          cases = sortCases(state.data.cases.filter(c => matchTerms(caseSearchText(c), terms)), "due").slice(0, 8);
          clients = state.data.clients.filter(c => matchTerms(clientSearchText(c), terms)).slice(0, 6);
          lics = state.data.licenses.filter(l => matchTerms(licenseSearchText(l), terms)).slice(0, 5);
        } else {
          cases = state.data.cases.filter(c => !c.archived).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0, 6);
          clients = []; lics = [];
        }
        items = [];
        if (cases.length) groups.push({ title: terms.length ? "案件" : "最近の案件", list: cases.map(c => ({ ic: "cases", t: c.title || "（無題）", sub: [caseClientName(c), c.completed ? "完了" : c.archived ? "保管" : dueInfo(c).label].filter(Boolean).join("・"), run: () => openDrawer("case", c.id) })) });
        if (clients.length) groups.push({ title: "顧客", list: clients.map(c => ({ ic: "users", t: clientDisplayName(c), sub: [c.person, c.phone].filter(Boolean).join("・"), run: () => openDrawer("client", c.id) })) });
        if (lics.length) groups.push({ title: "許認可", list: lics.map(l => ({ ic: "license", t: l.name, sub: `${clientById(l.clientId)?.name || ""}・${licenseInfo(l).label}`, run: () => openLicenseForm(l.id) })) });
        if (cmds.length) groups.push({ title: "コマンド", list: cmds.slice(0, terms.length ? 5 : 20).map(cmd => ({ ic: cmd.ic, t: cmd.label, sub: cmd.hint ? cmd.hint : "", run: cmd.run })) });
        let html = "";
        for (const g of groups) {
          html += `<div class="pal-group">${esc(g.title)}</div>`;
          for (const it of g.list) {
            const i = items.length;
            items.push(it);
            html += `<button type="button" class="pal-item" data-pal="${i}" role="option">${icon(it.ic)}<span class="t">${esc(it.t)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ""}</button>`;
          }
        }
        box.innerHTML = html || `<div class="pal-empty">見つかりませんでした</div>`;
        active = 0;
        highlight();
      };
      const highlight = () => {
        $$(".pal-item", box).forEach((b, i) => b.classList.toggle("active", i === active));
        const el = $(`.pal-item[data-pal="${active}"]`, box);
        if (el) el.scrollIntoView({ block: "nearest" });
      };
      const exec = i => {
        const it = items[i];
        if (!it) return;
        closeModal();
        setTimeout(() => it.run(), 10);
      };
      input.addEventListener("input", render);
      input.addEventListener("keydown", e => {
        if (e.isComposing) return;
        if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(items.length - 1, active + 1); highlight(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(0, active - 1); highlight(); }
        else if (e.key === "Enter") { e.preventDefault(); exec(active); }
      });
      box.addEventListener("click", e => {
        const b = e.target.closest("[data-pal]");
        if (b) exec(Number(b.dataset.pal));
      });
      render();
      setTimeout(() => input.focus(), 30);
    }
  });
}

/* ============ 顧客の重複整理・統合・削除 ============ */

const CORP_FORMS = [
  "株式会社", "有限会社", "合同会社", "合資会社", "合名会社",
  "一般社団法人", "一般財団法人", "公益社団法人", "公益財団法人",
  "社会福祉法人", "医療法人社団", "医療法人財団", "医療法人",
  "特定非営利活動法人", "npo法人", "学校法人", "宗教法人", "協同組合"
];
const DUP_REASON_LABEL = { name: "名前が同じ", phone: "電話番号が同じ", email: "メールが同じ" };

/* 表記ゆれ（全角半角・スペース・(株)/㈱/株式会社・様 など）をそろえたキー */
function clientNameKey(name) {
  let s = String(name || "");
  try { s = s.normalize("NFKC"); } catch { /* noop */ }
  s = s.toLowerCase()
    .replace(/[\s　]+/g, "")
    .replace(/\(株\)/g, "株式会社").replace(/\(有\)/g, "有限会社").replace(/\(同\)/g, "合同会社")
    .replace(/\(資\)/g, "合資会社").replace(/\(名\)/g, "合名会社")
    .replace(/\(一社\)/g, "一般社団法人").replace(/\(一財\)/g, "一般財団法人")
    .replace(/\(医\)/g, "医療法人").replace(/\(福\)/g, "社会福祉法人").replace(/\(npo\)/g, "npo法人")
    .replace(/(様|さま|殿|御中)$/, "")
    .replace(/[()[\]{}「」『』【】〔〕<>《》・･,，、。.'"`’‘”“!?！？~〜_/／\\:：;；\-‐－―]/g, "");
  return s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
}
/* さらに法人格（株式会社など）の有無・前後を無視したキー */
function clientLooseKey(name) {
  let s = clientNameKey(name);
  for (const f of CORP_FORMS) s = s.split(f).join("");
  return s;
}
function phoneKey(p) {
  let d = toHalfWidth(String(p || "")).replace(/[^\d+]/g, "");
  if (d.startsWith("+81")) d = "0" + d.slice(3);
  d = d.replace(/\D/g, "");
  return d.length >= 10 ? d : "";
}
function emailKey(e) {
  const s = String(e || "").trim().toLowerCase();
  return s.includes("@") ? s : "";
}
function pairKey(a, b) { return a < b ? `${a}|${b}` : `${b}|${a}`; }
function clientUsage(id) {
  return {
    cases: state.data.cases.filter(c => c.clientId === id).length,
    licenses: state.data.licenses.filter(l => l.clientId === id).length
  };
}

/* 似ている顧客（名前・電話・メール）を、似ている順に返す */
function findSimilarClients({ id = "", name = "", phone = "", email = "" }, { contain = false } = {}) {
  const lk = clientLooseKey(name);
  const pk = phoneKey(phone);
  const ek = emailKey(email);
  const out = [];
  for (const c of state.data.clients) {
    if (c.id === id) continue;
    const clk = clientLooseKey(c.name);
    let score = 0;
    if (lk.length >= 2 && clk === lk) score += 3;
    else if (contain && lk.length >= 3 && clk.length >= 3 && (clk.includes(lk) || lk.includes(clk))) score += 1;
    if (pk && phoneKey(c.phone) === pk) score += 2;
    if (ek && emailKey(c.email) === ek) score += 2;
    if (score) out.push({ c, score });
  }
  return out
    .sort((a, b) => b.score - a.score || Number(a.c.archived) - Number(b.c.archived))
    .map(x => x.c);
}

/* 重複の可能性がある顧客のグループ（サンプルは除く。「重複ではない」とした組は除外） */
function findDuplicateGroups() {
  const clients = state.data.clients.filter(c => !c.demo);
  const ignore = new Set(S().dupIgnore || []);
  const keyMap = new Map();
  const add = (reason, key, id) => {
    if (!key) return;
    const k = `${reason}:${key}`;
    if (!keyMap.has(k)) keyMap.set(k, []);
    keyMap.get(k).push(id);
  };
  for (const c of clients) {
    const lk = clientLooseKey(c.name);
    if (lk.length >= 2) add("name", lk, c.id);
    add("phone", phoneKey(c.phone), c.id);
    add("email", emailKey(c.email), c.id);
  }
  const parent = new Map(clients.map(c => [c.id, c.id]));
  const find = x => {
    while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); }
    return x;
  };
  const reasons = new Map();
  for (const [k, ids] of keyMap) {
    if (ids.length < 2) continue;
    const reason = k.slice(0, k.indexOf(":"));
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const pk = pairKey(ids[i], ids[j]);
        if (ignore.has(pk)) continue;
        if (!reasons.has(pk)) reasons.set(pk, new Set());
        reasons.get(pk).add(reason);
        const ra = find(ids[i]), rb = find(ids[j]);
        if (ra !== rb) parent.set(ra, rb);
      }
    }
  }
  const groups = new Map();
  for (const c of clients) {
    const r = find(c.id);
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(c);
  }
  const weight = c => { const u = clientUsage(c.id); return u.cases + u.licenses; };
  return [...groups.values()]
    .filter(g => g.length > 1)
    .map(members => {
      const rs = new Set();
      for (let i = 0; i < members.length; i++) {
        for (let j = i + 1; j < members.length; j++) {
          const s = reasons.get(pairKey(members[i].id, members[j].id));
          if (s) s.forEach(x => rs.add(x));
        }
      }
      members.sort((a, b) => weight(b) - weight(a) || Number(a.archived) - Number(b.archived) || String(a.createdAt).localeCompare(String(b.createdAt)));
      return { members, reasons: [...rs] };
    })
    .sort((a, b) => clientNameKey(a.members[0].name).localeCompare(clientNameKey(b.members[0].name), "ja"));
}

/* ---------- 統合（データ操作） ---------- */
function mergeClientsData(data, keepId, removeIds) {
  const keep = data.clients.find(c => c.id === keepId);
  if (!keep) return null;
  const removes = data.clients.filter(c => removeIds.includes(c.id) && c.id !== keepId);
  if (!removes.length) return null;
  const now = nowISO();
  const notes = [];
  const same = (a, b) => normText(a).replace(/[\s\-‐－―ー]/g, "") === normText(b).replace(/[\s\-‐－―ー]/g, "");
  for (const r of removes) {
    const diff = [];
    if (clientNameKey(r.name) !== clientNameKey(keep.name)) diff.push(`名称：${r.name}`);
    for (const [k, label] of [["kana", "フリガナ"], ["person", "担当者"], ["phone", "電話"], ["email", "メール"], ["address", "住所"]]) {
      const a = String(keep[k] || "").trim();
      const b = String(r[k] || "").trim();
      if (!b) continue;
      if (!a) keep[k] = b;
      else if (!same(a, b)) diff.push(`${label}：${b}`);
    }
    if (diff.length) notes.push(`【統合した顧客「${r.name}」の登録内容】\n${diff.join("\n")}`);
    for (const [k] of MEMO_FIELDS) {
      const a = String(keep.memoSections[k] || "").trim();
      const b = String(r.memoSections[k] || "").trim();
      if (b && !a.includes(b)) keep.memoSections[k] = a ? `${a}\n${b}` : b;
    }
    if (String(r.createdAt) < String(keep.createdAt)) keep.createdAt = r.createdAt;
  }
  if (notes.length) keep.memoSections.special = [String(keep.memoSections.special || "").trim(), ...notes].filter(Boolean).join("\n\n");
  keep.memo = composeMemo(keep.memoSections);
  if (keep.archived && removes.some(r => !r.archived)) keep.archived = false;
  keep.demo = Boolean(keep.demo && removes.every(r => r.demo));
  keep.updatedAt = now;
  const ids = new Set(removes.map(r => r.id));
  let movedCases = 0, movedLicenses = 0;
  for (const c of data.cases) {
    if (!ids.has(c.clientId)) continue;
    c.clientId = keep.id;
    c.clientName = keep.name;
    c.updatedAt = now;
    movedCases++;
  }
  for (const l of data.licenses) {
    if (!ids.has(l.clientId)) continue;
    l.clientId = keep.id;
    l.updatedAt = now;
    movedLicenses++;
  }
  data.clients = data.clients.filter(c => !ids.has(c.id));
  return { keep, removed: removes, movedCases, movedLicenses };
}
function afterClientsRemoved(removedIds, keepId = "") {
  if (state.caseFilters.clientId && removedIds.includes(state.caseFilters.clientId)) state.caseFilters.clientId = keepId;
  if (state.drawer && state.drawer.type === "client" && removedIds.includes(state.drawer.id)) {
    state.drawer = keepId ? { type: "client", id: keepId } : null;
  }
}
async function performMerge(keepId, removeIds) {
  const keep = clientById(keepId);
  const removeList = removeIds.filter(id => id !== keepId && clientById(id));
  if (!keep || !removeList.length) return null;
  const keepName = keep.name;
  await createSnapshot("顧客の統合の前");
  let res = null;
  commit(data => {
    res = mergeClientsData(data, keepId, removeList);
    if (!res) return false;
    afterClientsRemoved(removeList, keepId);
    return true;
  }, { undo: () => `「${keepName}」に${res.removed.length}件の顧客をまとめました（案件${res.movedCases}件・許認可${res.movedLicenses}件を移動）` });
  return res;
}
function deleteClientAndLinks(id) {
  const cl = clientById(id);
  if (!cl) return;
  const u = clientUsage(id);
  commit(data => {
    const caseIds = new Set(data.cases.filter(c => c.clientId === id).map(c => c.id));
    const licIds = new Set(data.licenses.filter(l => l.clientId === id).map(l => l.id));
    data.cases = data.cases.filter(c => c.clientId !== id);
    data.licenses = data.licenses.filter(l => l.clientId !== id);
    data.cases.forEach(c => { if (licIds.has(c.licenseId)) c.licenseId = ""; });
    data.clients = data.clients.filter(c => c.id !== id);
    if (state.drawer && (state.drawer.id === id || caseIds.has(state.drawer.id))) state.drawer = null;
    afterClientsRemoved([id], "");
    return true;
  }, { undo: `「${cl.name}」と案件${u.cases}件・許認可${u.licenses}件を削除しました` });
}
function ignoreDuplicateGroup(ids) {
  commit(data => {
    const set = new Set(data.settings.dupIgnore || []);
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) set.add(pairKey(ids[i], ids[j]));
    data.settings.dupIgnore = [...set];
    return true;
  }, { message: "この組は「重複ではない」として記録しました" });
}

/* ---------- 削除（画面） ---------- */
async function deleteClient(id) {
  const cl = clientById(id);
  if (!cl) return;

  if (!u.cases && !u.licenses) {

    if (!ok) return;
    commit(data => {
      data.clients = data.clients.filter(x => x.id !== id);
      afterClientsRemoved([id], "");

    return;

}

        box.classList.remove("hidden");
      };
      m.addEventListener("change", e => {
        if (e.target.id === "mgOther") render();
        else if (e.target.name === "mgKeep") { syncMergeCards(m); summary(); }
      });
      $("#mgGo", m).addEventListener("click", async () => {
        const otherSel = $("#mgOther", m).value;
        const keepId = ($('[name="mgKeep"]:checked', m) || {}).value;
        if (!otherSel || !keepId) return;
        const removeId = keepId === cl.id ? otherSel : cl.id;
        closeModal();
        await performMerge(keepId, [removeId]);
      });
      render();
    }
  });
}
function openDuplicateFinder() {
  let groups = [];
  const render = m => {
    groups = findDuplicateGroups();
    const box = $("#dupBody", m);
    if (!groups.length) {
      box.innerHTML = emptyBox("重複の可能性がある顧客は見つかりませんでした。");
      return;
    }
    box.innerHTML = `<p class="hint" style="margin-bottom:10px">名前（スペース・全角半角・株式会社の有無などの違いを無視）、電話番号、メールアドレスが同じ顧客を並べています。残す顧客を選んで「統合」を押すと、ほかの顧客の案件・許認可が移り、1件にまとまります。別人・別会社なら「重複ではない」を押してください。</p>`
      + groups.map((g, gi) => `
        <section class="dup-group">
          <div class="dup-head"><span class="dup-no">${gi + 1}</span>${g.reasons.map(r => `<span class="badge amber">${esc(DUP_REASON_LABEL[r] || r)}</span>`).join("")}<span class="hint">${g.members.length}件</span></div>
          <div class="merge-grid">${g.members.map((c, i) => mergeCardHTML(c, i === 0, `dupKeep-${gi}`)).join("")}</div>
          <div class="btn-row" style="margin-top:10px">
            <button type="button" class="btn small primary" data-dup-merge="${gi}">${icon("users")}選んだ顧客に統合</button>
            <button type="button" class="btn small" data-dup-ignore="${gi}">重複ではない</button>
          </div>
        </section>`).join("");
  };
  openModal({
    title: "重複している顧客の整理",
    size: "lg",
    body: `<div id="dupBody"></div>`,
    foot: `<button type="button" class="btn primary" data-action="modal-close">閉じる</button>`,
    onMount: m => {
      render(m);
      m.addEventListener("change", e => {
        if (e.target.name && e.target.name.startsWith("dupKeep-")) syncMergeCards(e.target.closest(".dup-group"));
      });
      m.addEventListener("click", async e => {
        const mg = e.target.closest("[data-dup-merge]");
        if (mg) {
          const gi = Number(mg.dataset.dupMerge);
          const g = groups[gi];
          const sel = $(`input[name="dupKeep-${gi}"]:checked`, m);
          if (!g || !sel) return;
          const keepId = sel.value;
          const removeIds = g.members.map(c => c.id).filter(x => x !== keepId);
          const keep = clientById(keepId);
          const moved = removeIds.reduce((a, rid) => { const u = clientUsage(rid); return { c: a.c + u.cases, l: a.l + u.licenses }; }, { c: 0, l: 0 });
          const ok = await askConfirm({
            title: "顧客を統合",
            message: `${removeIds.map(rid => `「${clientById(rid).name}」`).join("")}を「${keep.name}」にまとめます。\n案件${moved.c}件・許認可${moved.l}件が「${keep.name}」に移ります。`,
            ok: "統合する"
          });
          if (!ok) return;
          await performMerge(keepId, removeIds);
          render(m);
          return;
        }
        const ig = e.target.closest("[data-dup-ignore]");
        if (ig) {
          const g = groups[Number(ig.dataset.dupIgnore)];
          if (!g) return;
          ignoreDuplicateGroup(g.members.map(c => c.id));
          render(m);
        }
      });
    }
  });
}


/* ============ 操作 ============ */

/* ---------- 案件 ---------- */
function setStatus(id, status) {
  const c = caseById(id);
  if (!c || !status) return;
  if (c.status === status && (status === DONE_STATUS) === c.completed) return;
  const title = c.title || "（無題）";
  let msgs = [];
  commit(data => {
    const x = data.cases.find(y => y.id === id);
    if (!x) return false;
    msgs = applyStatusChange(data, x, status);
    return true;
  }, { undo: () => `「${title}」を「${status}」にしました${msgs.length ? `（${msgs.join("・")}）` : ""}` });
}
function advanceStatus(id) {
  const c = caseById(id);
  if (c) setStatus(id, nextStatusOf(c.status));
}
function setCompleted(id, done) {
  const c = caseById(id);
  if (!c) return;
  const back = c.statusBeforeDone && c.statusBeforeDone !== DONE_STATUS && S().statuses.includes(c.statusBeforeDone) ? c.statusBeforeDone : S().defaultStatus;
  setStatus(id, done ? DONE_STATUS : back);
}
function moveDue(id, date) {
  const c = caseById(id);
  if (!c || c.dueDate === date) return;
  commit(data => {
    const x = data.cases.find(y => y.id === id);
    if (!x) return false;
    x.dueDate = date;
    x.updatedAt = nowISO();
    return true;
  }, { undo: `「${c.title}」の期限を${fmtDate(date)}に変更しました` });
}
function toggleCheck(caseId, checkId) {
  let allDone = false;
  const c = caseById(caseId);
  commit(data => {
    const x = data.cases.find(y => y.id === caseId);
    const it = x && x.checklist.find(i => i.id === checkId);
    if (!it) return false;
    it.done = !it.done;
    it.doneAt = it.done ? nowISO() : "";
    x.updatedAt = nowISO();
    allDone = it.done && x.checklist.every(i => i.done);
    return true;
  });
  if (allDone && c && isOpen(c)) {
    const next = nextStatusOf(c.status);
    toast("チェックリストがすべて完了しました", next !== c.status ? { action: `「${next}」へ進める`, onAction: () => advanceStatus(caseId) } : {});
  }
}
function addCheckItem(caseId, text) {
  commit(data => {
    const x = data.cases.find(y => y.id === caseId);
    if (!x) return false;
    x.checklist.push({ id: uid("chk"), text, done: false, doneAt: "" });
    x.updatedAt = nowISO();
    return true;
  });
}
function deleteCheckItem(caseId, checkId) {
  const c = caseById(caseId);
  const it = c && c.checklist.find(i => i.id === checkId);
  if (!it) return;
  commit(data => {
    const x = data.cases.find(y => y.id === caseId);
    x.checklist = x.checklist.filter(i => i.id !== checkId);
    x.updatedAt = nowISO();
    return true;
  }, { undo: `「${it.text}」を削除しました` });
}
function addLogEntry(caseId, text, { quiet = false } = {}) {
  commit(data => {
    const x = data.cases.find(y => y.id === caseId);
    if (!x) return false;
    const line = `[${stampNow()}] ${text}`;
    const cur = x.memoSections.process.replace(/\s+$/, "");
    x.memoSections.process = cur ? `${cur}\n${line}` : line;
    x.memo = composeMemo(x.memoSections);
    x.updatedAt = nowISO();
    return true;
  }, { message: quiet ? null : "経過を記録しました" });
}
function archiveCase(id, archived = true) {
  const c = caseById(id);
  if (!c) return;
  commit(data => {
    const x = data.cases.find(y => y.id === id);
    x.archived = archived;
    x.updatedAt = nowISO();
    return true;
  }, { undo: archived ? `「${c.title}」を保管しました` : `「${c.title}」を保管から戻しました` });
}
async function deleteCase(id) {
  const c = caseById(id);
  if (!c) return;
  const ok = await askConfirm({ title: "案件を完全に削除", message: `「${c.title}」を削除します。この操作は直後の「元に戻す」か復元ポイントでのみ取り消せます。`, ok: "削除する", danger: true });
  if (!ok) return;
  if (state.drawer && state.drawer.id === id) state.drawer = null;
  commit(data => { data.cases = data.cases.filter(x => x.id !== id); return true; }, { undo: `「${c.title}」を削除しました` });
}
function duplicateCase(id) {
  const c = caseById(id);
  if (!c) return;
  let newId = null;
  commit(data => {
    const copy = normalizeCase({
      ...JSON.parse(JSON.stringify(c)),
      id: uid(), caseNo: "", demo: false, title: `${c.title}（コピー）`, status: S().defaultStatus, completed: false, completedAt: "", archived: false,
      appliedDate: "", expectedDate: "", billing: "none", invoiceDate: "", paidDate: "", repeatSpawned: false,
      memoSections: { ...c.memoSections, process: "" },
      checklist: c.checklist.map(x => ({ text: x.text, done: false })),
      createdAt: nowISO(), updatedAt: nowISO()
    }, S());
    data.cases.unshift(copy);
    newId = copy.id;
    return true;
  }, { message: "案件を複製しました" });
  if (newId) openCaseForm(newId);
}

function guessRenewTemplate(l) {
  if (l.templateId && templateById(l.templateId)) return l.templateId;
  if (/建設業/.test(l.name) && templateById("tpl-kensetsu-renew")) return "tpl-kensetsu-renew";
  return "";
}
function licenseRenewCase(id) {
  const l = licenseById(id);
  if (!l) return;
  const info = licenseInfo(l);
  const tplId = guessRenewTemplate(l);
  const tpl = templateById(tplId);
  closeModal();
  openCaseForm(null, {
    title: `${l.name} 更新申請`,
    clientId: l.clientId,
    dueDate: info.deadline && info.deadline >= state.today ? info.deadline : state.today,
    category: tpl ? tpl.category : (S().categories.find(cat => l.name.includes(cat.replace(/許可|認定|免許/g, ""))) || "その他"),
    templateId: tplId,
    licenseId: l.id,
    priority: info.state === "late" || info.state === "expired" ? "high" : "medium"
  });
}
async function licenseRoll(id) {
  const l = licenseById(id);
  if (!l) return;
  if (!l.expiryDate) { toast("有効期限が未設定です", { type: "error" }); return; }
  const years = l.renewYears || 5;
  const newGranted = addDays(l.expiryDate, 1);
  const newExpiry = addYears(l.expiryDate, years);
  const ok = await askConfirm({
    title: "更新済みにする",
    message: `有効期限を${years}年先へ進めます。\n新しい許可日：${fmtDate(newGranted, { year: true })}\n新しい有効期限：${fmtDate(newExpiry, { year: true })}\n（実際の許可通知の日付と違う場合は、あとで編集してください）`,
    ok: "更新済みにする"
  });
  if (!ok) return;
  closeModal();
  commit(data => {
    const x = data.licenses.find(y => y.id === id);
    x.grantedDate = newGranted;
    x.expiryDate = newExpiry;
    x.updatedAt = nowISO();
    return true;
  }, { undo: `「${l.name}」の有効期限を${fmtDate(newExpiry, { year: true })}に更新しました` });
}

/* ---------- 印刷 ---------- */
function printHTML(html, title) {
  const area = $("#printArea");

async function saveLists() {
  const cats = uniq($("#setCategories").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean));
  let sts = uniq($("#setStatuses").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean));
  if (!cats.length) { toast("業務カテゴリを1つ以上入れてください", { type: "error" }); return; }
  sts = sts.filter(x => x !== DONE_STATUS);
  if (!sts.length) { toast("「完了」以外のステータスを1つ以上入れてください", { type: "error" }); return; }
  sts.push(DONE_STATUS);
  const orphan = state.data.cases.filter(c => !c.completed && !sts.includes(c.status)).length;
  if (orphan && !(await askConfirm({ title: "ステータスの変更", message: `削除したステータスの案件が${orphan}件あります。案件はそのまま残り、ボードでは別の列に表示されます。保存しますか？`, ok: "保存する" }))) return;
  commit(data => {
    data.settings.categories = cats;
    data.settings.statuses = sts;
    if (!sts.includes(data.settings.defaultStatus)) data.settings.defaultStatus = sts.includes("作成中") ? "作成中" : sts[0];
    return true;
  }, { remount: true, message: "カテゴリ・ステータスを保存しました" });
}
async function resetLists() {
  if (!(await askConfirm({ title: "初期値に戻す", message: "業務カテゴリとステータスを初期値に戻します（案件のデータは変わりません）。", ok: "戻す" }))) return;
  commit(data => {
    data.settings.categories = [...DEFAULT_CATEGORIES];
    data.settings.statuses = [...DEFAULT_STATUSES];
    return true;
  }, { remount: true, message: "初期値に戻しました" });
}
function updateSetting(key, value) {
  commit(data => {
    const s = data.settings;
    if (key === "weekStart") s.weekStart = value === "1" ? 1 : 0;
    else if (key === "soonDays") s.soonDays = clamp(toIntOrNull(value) || 7, 1, 60);
    else if (key === "backupReminderDays") s.backupReminderDays = clamp(toIntOrNull(value) ?? 7, 0, 365);
    else if (key === "theme") s.theme = value;
    else if (key === "defaultStatus") s.defaultStatus = value;
    return true;
  }, { message: "設定を保存しました" });
}
async function deleteTemplate(id) {
  const t = templateById(id);
  if (!t) return;
  if (!(await askConfirm({ title: "テンプレートを削除", message: `「${t.name}」を削除します（登録済みの案件には影響しません）。`, ok: "削除する", danger: true }))) return;
  commit(data => { data.settings.templates = data.settings.templates.filter(x => x.id !== id); return true; }, { undo: `「${t.name}」を削除しました` });
}
function duplicateTemplate(id) {
  const t = templateById(id);
  if (!t) return;
  commit(data => {
    const copy = normalizeTemplate({ ...JSON.parse(JSON.stringify(t)), id: uid("tpl"), name: `${t.name}（コピー）` });
    const i = data.settings.templates.findIndex(x => x.id === id);
    data.settings.templates.splice(i + 1, 0, copy);
    return true;
  }, { message: "テンプレートを複製しました" });
}
function restoreTemplates() {
  const ids = new Set(S().templates.map(t => t.id));
  const missing = DEFAULT_TEMPLATES.filter(t => !ids.has(t.id));
  if (!missing.length) { toast("初期テンプレートはすべて入っています"); return; }
  commit(data => { data.settings.templates.push(...missing.map(normalizeTemplate)); return true; }, { message: `初期テンプレートを${missing.length}件追加しました` });
}

/* ---------- イベント委譲 ---------- */
function bindGlobalEvents() {
  document.addEventListener("click", e => {
    const t = e.target;
    if (!(t instanceof Element)) return;
    if (t.closest("#confirmRoot")) return;
    const act = t.closest("[data-action]");
    if (act && !act.disabled) {
      const fn = ACTIONS[act.dataset.action];
      if (fn) {
        if (act.tagName === "A") e.preventDefault();
        fn(act, e);
        return;
      }
    }
    if (t.closest("#modalRoot form")) return;
    const oc = t.closest("[data-open-case]");
    if (oc) { openDrawer("case", oc.dataset.openCase); return; }
    const ocl = t.closest("[data-open-client]");
    if (ocl) { openDrawer("client", ocl.dataset.openClient); return; }
    const ol = t.closest("[data-open-license]");
    if (ol) { openLicenseForm(ol.dataset.openLicense); return; }
    const nv = t.closest("[data-view]");
    if (nv) { closeModal(); setView(nv.dataset.view); return; }
    const cd = t.closest("[data-cal-date]");
    if (cd) {
      state.calSelected = cd.dataset.calDate;
      $$(".cal-cell.selected").forEach(x => x.classList.remove("selected"));
      cd.classList.add("selected");
      $("#calSide").innerHTML = calSideHTML();
    }
  });

  document.addEventListener("change", e => {
    const t = e.target;
    if (!(t instanceof Element)) return;
    const ch = t.dataset.change;
    if (ch === "case-filter") {
      state.caseFilters[t.dataset.key] = t.value;
      if (t.dataset.key === "sort") { localMeta.caseSort = t.value; saveLocalMeta(); }
      Views.cases.update($("#view"));
    } else if (ch === "client-filter") {
      state.clientFilters[t.dataset.key] = t.value;
      Views.clients.update($("#view"));
    } else if (ch === "license-filter") {
      state.licenseFilters[t.dataset.key] = t.value;
      Views.licenses.update($("#view"));
    } else if (ch === "drawer-status") {
      setStatus(t.dataset.id, t.value);
    } else if (ch === "check-item") {
      toggleCheck(t.dataset.id, t.dataset.check);
    } else if (t.dataset.settingSelect) {
      updateSetting(t.dataset.settingSelect, t.value);
    }
  });

  const refreshCases = debounce(() => { if (state.view === "cases") Views.cases.update($("#view")); }, 120);
  const refreshClients = debounce(() => { if (state.view === "clients") Views.clients.update($("#view")); }, 120);
  const refreshLicenses = debounce(() => { if (state.view === "licenses") Views.licenses.update($("#view")); }, 120);
  const saveSettingsSoon = debounce(() => { state.data.meta.updatedAt = nowISO(); persist(); }, 500);
  document.addEventListener("input", e => {
    const t = e.target;
    if (!(t instanceof Element)) return;
    if (t.classList.contains("invalid")) t.classList.remove("invalid");
    const inp = t.dataset.input;
    if (inp === "case-q") { state.caseFilters.q = t.value; refreshCases(); }
    else if (inp === "client-q") { state.clientFilters.q = t.value; refreshClients(); }
    else if (inp === "license-q") { state.licenseFilters.q = t.value; refreshLicenses(); }
    else if (t.dataset.setting) {
      const [group, key] = t.dataset.setting.split(".");
      if (state.data.settings[group]) { state.data.settings[group][key] = t.value; saveSettingsSoon(); }
    }
  });

  document.addEventListener("submit", e => {
    const form = e.target;
    const kind = form.dataset && form.dataset.form;
    if (!kind) return;
    e.preventDefault();
    const input = form.querySelector("input");
    const text = input ? input.value.trim() : "";
    if (!text) return;
    input.value = "";
    if (kind === "add-check") addCheckItem(form.dataset.id, text);
    else if (kind === "add-log") addLogEntry(form.dataset.id, text);
  });

  document.addEventListener("keydown", e => {
    if (confirmIsOpen()) return;
    const t = e.target;
    const typing = t instanceof Element && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
    const mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === "k" || e.key === "K")) { e.preventDefault(); openPalette(); return; }
    if (e.key === "Escape") {
      if (modalIsOpen()) { e.preventDefault(); closeModal(); return; }
      if (state.drawer) { e.preventDefault(); closeDrawer(); return; }
      return;
    }
    if (mod && e.key === "Enter" && modalIsOpen()) {
      const form = $("#modalRoot form");
      if (form) {
        e.preventDefault();
        if (form.requestSubmit) form.requestSubmit();
        else form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
      }
      return;
    }
    if (e.key === "Enter" && !typing && t instanceof Element && t.matches("[data-open-case],[data-open-client],[data-open-license],[data-cal-date]")) {
      e.preventDefault();
      t.click();
      return;
    }
    if (typing || mod || e.altKey || e.isComposing || modalIsOpen()) return;
    if (e.key === "n" || e.key === "N") { e.preventDefault(); openCaseForm(); }
    else if (e.key === "c" || e.key === "C") { e.preventDefault(); openClientForm(); }
    else if (e.key === "/") { e.preventDefault(); openPalette(); }
    else if (e.key === "?") { e.preventDefault(); openHelp(); }
    else if (/^[1-7]$/.test(e.key)) { e.preventDefault(); setView(VIEW_KEYS[Number(e.key) - 1]); }
  });

  /* ドラッグ＆ドロップ（ボードでステータス変更・カレンダーで期限変更） */
  document.addEventListener("dragstart", e => {
    const card = e.target instanceof Element && e.target.closest("[data-drag-case]");
    if (!card) return;
    state.dragId = card.dataset.dragCase;
    try { e.dataTransfer.setData("text/plain", state.dragId); e.dataTransfer.effectAllowed = "move"; } catch { /* noop */ }
    card.classList.add("dragging");
  });
  document.addEventListener("dragend", () => {
    $$(".dragging").forEach(x => x.classList.remove("dragging"));
    $$(".drop-hover").forEach(x => x.classList.remove("drop-hover"));
    state.dragId = null;
  });
  document.addEventListener("dragover", e => {
    if (!state.dragId) return;
    const z = e.target instanceof Element && e.target.closest("[data-drop-status],[data-drop-date]");
    if (!z) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = "move"; } catch { /* noop */ }
    if (!z.classList.contains("drop-hover")) {
      $$(".drop-hover").forEach(x => x.classList.remove("drop-hover"));
      z.classList.add("drop-hover");
    }
  });
  document.addEventListener("dragleave", e => {
    const z = e.target instanceof Element && e.target.closest("[data-drop-status],[data-drop-date]");
    if (z && !(e.relatedTarget instanceof Node && z.contains(e.relatedTarget))) z.classList.remove("drop-hover");
  });
  document.addEventListener("drop", e => {
    const z = e.target instanceof Element && e.target.closest("[data-drop-status],[data-drop-date]");
    if (!z || !state.dragId) return;
    e.preventDefault();
    const id = state.dragId;
    state.dragId = null;
    z.classList.remove("drop-hover");
    if (z.dataset.dropStatus) setStatus(id, z.dataset.dropStatus);
    else if (z.dataset.dropDate) moveDue(id, z.dataset.dropDate);
  });

  $("#fileJson").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (file) handleJSONFile(file);
  });
  $("#fileCsv").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (file) handleClientCSV(file);
  });
}


/* ============ 起動 ============ */

function onStorageEvent(e) {
  if (e.key !== STORAGE_KEY || e.newValue == null || e.newValue === lastWrittenJSON) return;
  try {
    state.data = normalizeData(JSON.parse(e.newValue));
    lastWrittenJSON = e.newValue;
    state.mounted = null;
    renderAll();
    toast("別のタブでの変更を反映しました");
  } catch { /* noop */ }
}

function tick() {
  const t = todayYMD();
  if (t !== state.today) {
    state.today = t;
    renderAll();
    dailySnapshot();
  } else renderSavePill();
}

function init() {
  state.storageUnavailable = !storageWorks();
  const loaded = loadData();
  state.data = loaded.data;
  state.today = todayYMD();
  state.caseMode = localMeta.caseMode === "board" ? "board" : "list";
  if (localMeta.caseSort) state.caseFilters.sort = localMeta.caseSort;
  if (loaded.source === "broken") state.brokenKey = loaded.brokenKey;

  const hashView = (location.hash || "").replace("#", "");
  state.view = VIEW_KEYS.includes(hashView) ? hashView : "home";
  try { history.replaceState(null, "", "#" + state.view); } catch { /* noop */ }

  bindGlobalEvents();
  renderAll();

  if (loaded.source === "legacy") {
    persist();
    createSnapshot(`旧バージョン（${loaded.key}）から引き継ぐ前のデータ`, loaded.raw, { keep: true });
    const n = state.data.cases.length, m = state.data.clients.length;
    toast(`以前のデータを引き継ぎました（案件${n}件・顧客${m}件）。元のデータもそのまま残しています。`, { timeout: 8000 });
  }

  dailySnapshot();
  autosaveInit();

  window.addEventListener("storage", onStorageEvent);
  window.addEventListener("popstate", () => {
    const v = (location.hash || "").replace("#", "");
    closeModal();
    setView(VIEW_KEYS.includes(v) ? v : "home", { push: false });
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  window.addEventListener("resize", debounce(() => { if (state.view === "money") Views.money.update($("#view")); }, 250));
  setInterval(tick, 60 * 1000);

  window.NK = { state, normalizeData, holidaysOfYear, addBusinessDays, licenseInfo, dueInfo, buildMessage, parseLog, version: APP_VERSION };
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
  </script>
</body>
</html>
